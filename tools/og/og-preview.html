<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>OG Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
  }

  body {
    position: relative;
    overflow: hidden;
    background: #0f172a;
    font-family: 'Inter', system-ui, sans-serif;
    color: #f8fafc;
    -webkit-font-smoothing: antialiased;
  }

  /* Blueprint grid с маской растворения */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148, 163, 184, 0.07) 1px, transparent 1px);
    background-size: 30px 30px;
    -webkit-mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 30%, transparent 80%);
    mask-image: radial-gradient(ellipse 120% 90% at 50% 0%, #000 30%, transparent 80%);
  }

  /* Свечения: Digital Blue + Cyan */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(620px 420px at 88% 8%, rgba(59, 130, 246, 0.22), transparent 65%),
      radial-gradient(560px 420px at 0% 100%, rgba(56, 189, 248, 0.12), transparent 62%);
  }

  .wrap {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 56px 72px 52px;
    display: flex;
    flex-direction: column;
  }

  /* --- Шапка баннера --- */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 18px;
  }

  .brand__mark {
    width: 64px;
    height: 64px;
    filter: drop-shadow(0 6px 18px rgba(59, 130, 246, 0.35));
  }

  .brand__name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }

  .brand__name .dot { color: #38bdf8; }

  .brand__tag {
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #94a3b8;
    letter-spacing: 0.04em;
  }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #94a3b8;
    border: 1px solid #334155;
    background: rgba(30, 41, 59, 0.5);
    border-radius: 999px;
    padding: 8px 18px;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }

  .chip b { color: #60a5fa; font-weight: 600; }

  /* --- Центральный блок --- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 18px;
    min-height: 0;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #38bdf8;
  }

  .eyebrow::before {
    content: '';
    width: 56px;
    height: 2px;
    background: linear-gradient(90deg, #3b82f6, transparent);
  }

  h1 {
    font-size: 76px;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.03em;
    color: #fff;
  }

  h1 .accent {
    background: linear-gradient(92deg, #60a5fa 0%, #38bdf8 85%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    max-width: 760px;
    font-size: 26px;
    line-height: 1.5;
    color: #cbd5e1;
    font-weight: 500;
  }

  .subtitle .sep { color: #475569; margin: 0 6px; }

  /* --- Нижняя строка --- */
  .bottom {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }

  .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 24px;
    color: #f8fafc;
    letter-spacing: 0.01em;
    border: 1px solid #334155;
    background: rgba(30, 41, 59, 0.55);
    border-radius: 12px;
    padding: 12px 20px;
  }

  .url .dot { color: #38bdf8; }

  .stats {
    display: flex;
    gap: 12px;
  }

  .stat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: #94a3b8;
    border: 1px solid rgba(148, 163, 184, 0.18);
    background: rgba(30, 41, 59, 0.42);
    border-radius: 10px;
    padding: 10px 16px;
    white-space: nowrap;
  }

  .stat b { color: #38bdf8; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 64 64" role="img" aria-label="AltaiR Lab">
          <defs>
            <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#1E293B"/>
              <stop offset="1" stop-color="#0F172A"/>
            </linearGradient>
            <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#3B82F6"/>
              <stop offset="1" stop-color="#38BDF8"/>
            </linearGradient>
          </defs>
          <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
          <path d="M20 46 L32 16 L44 46" fill="none" stroke="url(#a)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M25.5 36.5 L38.5 36.5" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round"/>
          <circle cx="44" cy="46" r="2.5" fill="#38BDF8"/>
        </svg>
        <div>
          <div class="brand__name">lab<span class="dot">.</span>altair-studio.ru</div>
          <div class="brand__tag">AltaiR Design System · Modern Tech (Slate)</div>
        </div>
      </div>
      <div class="chip">поддомен <b>//</b> ветвь большого проекта</div>
    </div>

    <div class="main">
      <div class="eyebrow">// открытый инженерный журнал студии</div>
      <h1>Лаборатория <span class="accent">AltaiR</span></h1>
      <div class="subtitle">
        Дизайн-системы<span class="sep">·</span>производительность<span class="sep">·</span>постмортемы<span class="sep">·</span>модули платформы<span class="sep">·</span>playbook
      </div>
    </div>

    <div class="bottom">
      <div class="url">lab<span class="dot">.</span>altair-studio<span class="dot">.</span>ru</div>
      <div class="stats">
        <div class="stat">PageSpeed <b>100/100</b></div>
        <div class="stat">CWV <b>✓ green</b></div>
        <div class="stat">TTFB <b>≈0.4 s</b></div>
      </div>
    </div>
  </div>
</body>
</html>
