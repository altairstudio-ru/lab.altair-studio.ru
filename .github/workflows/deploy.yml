name: Deploy to Beget

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-beget
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Inject OG image tags
        run: npm run inject:og

      - name: Deploy via SFTP to Beget
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_LOGIN: ${{ secrets.SFTP_LOGIN }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_DIR: ${{ secrets.SFTP_DIR }}
        run: node scripts/deploy.mjs